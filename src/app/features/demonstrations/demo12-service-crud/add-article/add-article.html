<h4>Add Article</h4>

<div class="card w-75 m-auto">
    <div class="text-center">
        <label>Name</label>
        <br>
        <input class="border" type="text" [(ngModel)]="article.name">
    </div>
    
    <div class="text-center">
        <label>Description</label>
        <br>
        <input class="border" type="text" [(ngModel)]="article.description">
    </div>
    
    <div class="text-center">
        <label>Price</label>
        <br>
        <input class="border" type="number" [(ngModel)]="article.price">
    </div>
    <div class="text-center">
        <label>stock</label>
        <br>
        <input class="border" type="number" [(ngModel)]="article.stock">
    </div>

    <div class="text-center">
        <button (click)="addArticle()">Add</button>
    </div>
</div>
