<h4>Ajout d'article</h4>

<div>
    <div>
        <label>Name</label>
        <input class="border-1" type="text" [(ngModel)]="newArticle.name">
    </div>
        <div>
        <label>Description</label>
        <input class="border-1" type="text" [(ngModel)]="newArticle.description">
    </div>
    <div>
        <label>Price</label>
        <input class="border-1" type="Number" [(ngModel)]="newArticle.price">
    </div>
        <div>
        <label>Stock</label>
        <input class="border-1" type="Number" [(ngModel)]="newArticle.stock">
    </div>

    <button (click)="envoieArticleParent()">Ajout</button>
</div>
